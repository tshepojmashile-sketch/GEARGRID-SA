{% extends "base.html" %}
{% block content %}
{% if request.query_params.get("error") %}
  <p class="error">{{ request.query_params.get("error") }}</p>
{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ current_user['csrf_token'] }}">
  <label>Supplier Name<br><input name="supplier_name" value="{{ item['supplier_name'] }}" required></label>
  <br><br>
  <label>Equipment Description<br><input name="equipment_description" value="{{ item['equipment_description'] }}" required></label>
  <br><br>
  <label>Total Units<br><input name="quantity_total" type="number" min="1" value="{{ item['quantity_total']|default(1, true) }}" required></label>
  <br><br>
  <label>Cost Per Unit (R)<br><input name="cost_per_unit" type="number" min="0" value="{{ item['cost_per_unit'] or 0 }}"></label>
  <br><br>
  <label>Notes<br><textarea name="notes" rows="3">{{ item['notes'] or '' }}</textarea></label>
  <br><br>
  <button class="btn blue" type="submit">Save</button>
</form>
<p class="meta" style="margin-top:16px"><a href="/sub-rentals">Back to Sub-Rentals</a></p>
{% endblock %}
