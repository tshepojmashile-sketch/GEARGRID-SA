{% extends "base.html" %}
{% block content %}
{% if request.query_params.get("error") %}
  <p class="error">{{ request.query_params.get("error") }}</p>
{% endif %}
<form method="post" class="equipment-form">
  <input type="hidden" name="csrf_token" value="{{ current_user['csrf_token'] }}">
  <label for="name">Equipment name</label>
  <input id="name" name="name" value="{{ item['name'] }}" required>
  <label for="category">Category</label>
  <select id="category" name="category">
    <option value="">— Select category —</option>
    {% for cat in equipment_categories %}
    <option value="{{ cat }}" {% if (item.get('category') or '') == cat %}selected{% endif %}>{{ cat }}</option>
    {% endfor %}
  </select>
  <label for="quantity">Quantity (units)</label>
  <input id="quantity" name="quantity" type="number" min="1" value="{{ item['quantity']|default(1, true) }}" required>
  <label for="price">Price</label>
  <input id="price" name="price" type="number" min="0" value="{{ item['price'] or 0 }}" required>
  <button class="btn blue" type="submit">Save</button>
</form>
<p><a href="/">Back</a></p>
{% endblock %}
