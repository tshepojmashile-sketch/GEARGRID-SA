{% extends "base.html" %}
{% block content %}
{% if error %}
  <p class="error">{{ error }}</p>
  <p><a href="/forgot-password">Request a new reset link</a></p>
{% else %}
  {% if request.query_params.get("error") %}
    <p class="error">{{ request.query_params.get("error") }}</p>
  {% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="New password" required minlength="8">
    <input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="8">
    <button class="btn blue" type="submit">Reset Password</button>
  </form>
{% endif %}
<p><a href="/login">Back to Login</a></p>
{% endblock %}
