{% extends "base.html" %}
{% block content %}
{% if request.query_params.get("submitted") %}
  <p>If that email exists in our system you will receive a reset link shortly.</p>
{% endif %}
<form method="post">
  <input type="email" name="email" placeholder="Your email" required>
  <button class="btn blue" type="submit">Request Reset</button>
</form>
<p><a href="/login">Back to Login</a></p>
{% endblock %}
