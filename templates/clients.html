{% extends "base.html" %}
{% block content %}
{% if request.query_params.get("error") %}
  <p class="error">{{ request.query_params.get("error") }}</p>
{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ current_user['csrf_token'] }}">
  <input name="name" placeholder="Client name" required>
  <button class="btn blue" type="submit">Add Client</button>
</form>
<hr>
{% for client in clients %}
  <div class="list-item">{{ client["name"] }}</div>
{% else %}
  <p>No clients yet.</p>
{% endfor %}
<p><a href="/">Back</a></p>
{% endblock %}
